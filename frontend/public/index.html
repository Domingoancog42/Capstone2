<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/mgb.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff8fb" />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem("hris_theme") === "dark" ? "dark" : "light";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute(
            "content",
            theme === "dark" ? "#020617" : "#fff8fb"
          );
        } catch (error) {
          // The application applies the light fallback when browser storage is unavailable.
        }
      })();
    </script>
    <meta
      name="description"
      content="DENR Human Resource Information System secure government portal."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/mgb.png" />
    <!--
      Google Identity Services, which draws the "Sign in with Google" button on the
      login screen (see GoogleSignInButton in src/components/UI_Login/login.jsx).
      The only external script this page loads, and the reason script-src in
      public/.htaccess names https://accounts.google.com/gsi/client. async+defer
      so it never holds up the bundle; the button waits for it instead.
    -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Mine Geoscience Bureau Human Resource Information System</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
