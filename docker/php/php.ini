; Loaded as conf.d/zz-hris.ini, after the base image's own files, so these win.
; The point of this file is to match what XAMPP's php.ini gives the app today --
; the official image's defaults are stricter in two places the app would notice.

; Attachments. leave_request.php and loan_request.php cap uploads at 10 MB and
; reject anything larger themselves, but PHP has to accept the request body
; before that check can run: over upload_max_filesize, $_FILES arrives empty and
; the endpoint reports "no file" instead of "too large". Both limits sit above
; the app's own, and post_max_size sits above upload_max_filesize because the
; rest of the multipart form travels in the same body.
upload_max_filesize = 12M
post_max_size = 16M

memory_limit = 256M

; reports.php and the bulk payslip ZIP walk a lot of rows. The image default of
; 0 (unlimited) applies to CLI only; the web SAPI would otherwise take php.ini's
; 30s.
max_execution_time = 120

; connection-pdo.php pins Asia/Manila for PHP and +08:00 for MySQL on every
; request, and that remains the authority. Setting it here too covers what runs
; before that require executes -- a startup error's timestamp, most of all -- so
; the container log does not mix two zones.
date.timezone = Asia/Manila

; The API answers in JSON and nothing else. A warning printed into the response
; body puts text in front of the opening brace and the front end's json() call
; throws on it, which turns a recoverable notice into a broken screen. Errors go
; to stderr, which Apache forwards to `docker compose logs app`.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; XAMPP's default, and what the session-expiry behaviour in the app was built
; against. The cookie parameters themselves are set in connection-pdo.php.
session.gc_maxlifetime = 1440

; revalidate_freq 0 means every request stats the file, so an edit through the
; bind mount shows up immediately -- the XAMPP behaviour. Raise it (or turn
; validate_timestamps off) only for a deployment that ships a fixed copy.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
