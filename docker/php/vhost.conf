# The project is bind-mounted at /var/www/html/Capstone2, one level below the
# document root, exactly as it sits below htdocs under XAMPP. That is the whole
# reason no application file needs a Docker-specific value: the bundle is still
# /Capstone2/frontend/build/, the API is still /Capstone2/frontend/backend/api/*.php,
# so REACT_APP_API_BASE_URL in .env.production, the "proxy" field in package.json
# and every path in resolveBackendAssetUrl() keep working untouched.

# Silences the AH00558 warning Apache emits at boot when it cannot work out its
# own name. Cosmetic, but it is the first thing in `docker compose logs app`.
ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # AllowOverride All is load-bearing, not boilerplate -- see the Dockerfile.
        # Debian's stock config sets it to None, under which every .htaccess in this
        # project is silently ignored and the API's deny list stops existing.
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # /var/www/html holds nothing but the mount, and Options -Indexes turns the bare
    # host into a 403 rather than a listing. Point it at the bundle instead; run
    # `npm run build` in frontend/ if this 404s.
    RedirectMatch ^/$ /Capstone2/frontend/build/

    # Apache's own logs go to the container's stdout/stderr, so `docker compose logs
    # app` shows requests and PHP errors together. php.ini sends error_log to the
    # same place.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
