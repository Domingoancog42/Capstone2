ServerName localhost

<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    <Directory /data>
        AllowOverride None
        Options -Indexes
        Require all denied
    </Directory>

    <Directory /data/uploads>
        AllowOverride None
        Options -Indexes
        Require all granted

        <FilesMatch "\.(?i:php|php[0-9]*|phtml|phps|phar|inc|cgi|pl|py|asp|aspx|jsp|sh|exe|dll|htaccess|htpasswd)$">
            Require all denied
        </FilesMatch>
    </Directory>

    RedirectMatch 302 ^/$ /api/health.php

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
