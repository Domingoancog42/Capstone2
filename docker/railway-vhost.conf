ServerName localhost

# The Debian image ships ServerTokens OS and ServerSignature On, which print "Apache/2.4.x (Debian)" on
# every error page. This file is included after conf-enabled/security.conf, so these win.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html

    # The image copies all of frontend/backend here, but only api/ and uploads/ are meant to answer
    # over HTTP. Deny by default so composer.json, composer.lock, vendor/ (directly runnable PHP),
    # templates/ and database/ stay closed without each needing its own rule.
    <Directory /var/www/html>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all denied
    </Directory>

    <Directory /var/www/html/api>
        Require all granted
    </Directory>

    # uploads/ is a symlink to the /data volume. <Directory> matches the path Apache was asked for, not
    # the symlink's target, so these rules have to name /var/www/html/uploads: a block for
    # /data/uploads never applies to a request. The volume has no copy of uploads/.htaccess, which is
    # why the same script ban is spelled out here.
    <Directory /var/www/html/uploads>
        AllowOverride None
        Options -Indexes +FollowSymLinks
        Require all granted

        <IfModule php_module>
            php_admin_flag engine off
        </IfModule>

        <FilesMatch "\.(?i:php|php[0-9]*|phtml|phps|phar|inc|cgi|pl|py|asp|aspx|jsp|sh|exe|dll|htaccess|htpasswd)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Absolute target on purpose. Railway terminates TLS and forwards plain HTTP to port 8080, so a
    # relative Redirect is expanded to http://<host>:8080/..., a port nothing outside listens on.
    RewriteEngine On
    RewriteRule ^/$ https://%{HTTP_HOST}/api/health.php [R=302,L]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
